<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Relay Client — Discord (Text)</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Inter,system-ui,sans-serif; background:#0b0714; color:#e8e6f0; display:flex; height:100vh; }
  #side { width:300px; background:#14101f; border-right:1px solid #2a2440; display:flex; flex-direction:column; }
  #main { flex:1; display:flex; flex-direction:column; }
  #login { padding:14px; border-bottom:1px solid #2a2440; }
  #login input { width:100%; padding:9px; border-radius:8px; border:1px solid #333; background:#0e0a1a; color:#fff; }
  #login button { width:100%; margin-top:8px; padding:9px; border:0; border-radius:8px; background:#5865F2; color:#fff; font-weight:700; cursor:pointer; }
  #status { font-size:12px; opacity:.8; margin-top:6px; min-height:16px; }
  #cols { display:flex; flex:1; min-height:0; }
  #guilds { width:86px; overflow-y:auto; border-right:1px solid #2a2440; padding:8px; }
  #channels { width:214px; overflow-y:auto; padding:8px; }
  .g, .c { padding:7px 8px; border-radius:8px; cursor:pointer; font-size:13px; margin-bottom:4px; background:transparent; border:0; color:inherit; width:100%; text-align:left; }
  .g:hover,.c:hover { background:#221c38; }
  .g.active,.c.active { background:#2d2650; }
  #msgs { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .m { background:#171227; border:1px solid #262046; border-radius:10px; padding:8px 10px; font-size:14px; }
  .m b { color:#a78bfa; } .m small { opacity:.55; margin-left:6px; font-size:11px; }
  .m img { max-width:320px; border-radius:8px; margin-top:6px; display:block; }
  #box { display:flex; gap:8px; padding:12px; border-top:1px solid #2a2440; }
  #box input { flex:1; padding:10px; border-radius:10px; border:1px solid #333; background:#0e0a1a; color:#fff; }
  #box button { padding:10px 16px; border-radius:10px; border:0; background:#5865F2; color:#fff; font-weight:700; cursor:pointer; }
  #warn { font-size:11px; opacity:.65; padding:8px 14px; border-bottom:1px solid #2a2440; line-height:1.5; }
</style>
</head>
<body>
<div id="side">
  <div id="login">
    <input id="token" type="password" placeholder="Token (sadece kendi hesabın, kimseyle paylaşma)" autocomplete="off" />
    <button id="conn">Bağlan (relay üzerinden)</button>
    <div id="status">Hazır. Önce backend'i yurtdışında (Render) çalıştır.</div>
  </div>
  <div id="warn">Bu istemci <b>discord.com'a direkt bağlanmaz</b>, sadece bu sunucuya bağlanır.<br>Token tarayıcı hafızasında durur, sunucuya kaydedilmez.<br>v1: sadece yazı. Ses/görüntü yok. Custom client = ban riski.</div>
  <div id="cols"><div id="guilds"></div><div id="channels"></div></div>
</div>
<div id="main">
  <div id="msgs"><div class="m">Henüz bağlı değil. Token gir → Bağlan.</div></div>
  <div id="box"><input id="inp" placeholder="Mesaj yaz..." maxlength="2000" /><button id="send">Gönder</button></div>
</div>
<script>
const $ = id => document.getElementById(id);
let token = sessionStorage.getItem("dc_relay_token") || "";
if (token) $("token").value = token;
let guilds = [], curGuild = null, curChan = null, gw = null, hbTimer = null, seq = null, sessionId = null;

async function api(path, method="GET", body=null) {
  const r = await fetch("/relay/rest/" + path, {
    method, headers: { "X-Discord-Auth": token, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error("API " + r.status);
  const t = await r.text();
  try { return JSON.parse(t); } catch { return t; }
}
function proxied(url) {
  try {
    const u = new URL(url);
    if (u.hostname.endsWith("discordapp.com") || u.hostname.endsWith("discordapp.net"))
      return "/relay/cdn/" + u.pathname.slice(1) + "?host=" + u.hostname;
  } catch {}
  return url;
}
function addMsg(author, text, ts, atts=[]) {
  const d = document.createElement("div"); d.className = "m";
  const time = ts ? new Date(ts).toLocaleTimeString("tr-TR") : "";
  d.innerHTML = "<b></b><small></small><div class='txt'></div>";
  d.querySelector("b").textContent = author; d.querySelector("small").textContent = time;
  d.querySelector(".txt").textContent = text || "";
  for (const a of atts) {
    if (a.content_type && a.content_type.startsWith("image/")) {
      const im = document.createElement("img"); im.src = proxied(a.url); im.loading = "lazy"; d.appendChild(im);
    } else if (a.url) { const x = document.createElement("a"); x.href = a.url; x.textContent = "[dosya] " + (a.filename||""); x.target="_blank"; d.appendChild(x); }
  }
  const box = $("msgs"); const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.appendChild(d); if (nearBottom) box.scrollTop = box.scrollHeight;
}
$("conn").onclick = async () => {
  token = $("token").value.trim(); if (!token) return alert("Token gir");
  sessionStorage.setItem("dc_relay_token", token);
  $("status").textContent = "Kimlik doğrulanıyor...";
  try {
    const me = await api("users/@me");
    $("status").textContent = "Giriş: " + me.username + " — guildler yükleniyor";
    guilds = await api("users/@me/guilds");
    renderGuilds(); connectGw();
  } catch(e) { $("status").textContent = "Hata: " + e.message + " (token yanlış ya da relay Discord'a ulaşamıyor)"; }
};
function renderGuilds() {
  const g = $("guilds"); g.innerHTML = "";
  guilds.forEach(x => {
    const b = document.createElement("button"); b.className = "g"; b.textContent = (x.name||"?").slice(0,14);
    b.title = x.name; b.onclick = () => { curGuild = x; curChan = null; [...g.children].forEach(c=>c.classList.remove("active")); b.classList.add("active"); loadChannels(x.id); };
    g.appendChild(b);
  });
}
async function loadChannels(gid) {
  $("channels").innerHTML = "yükleniyor...";
  try {
    const chs = await api(`guilds/${gid}/channels`);
    chs.sort((a,b)=>(a.position||0)-(b.position||0));
    const c = $("channels"); c.innerHTML = "";
    chs.filter(x=>x.type===0||x.type===5).forEach(x => {
      const b = document.createElement("button"); b.className = "c"; b.textContent = "# " + x.name;
      b.onclick = () => { curChan = x; [...c.children].forEach(y=>y.classList.remove("active")); b.classList.add("active"); loadMsgs(x.id); };
      c.appendChild(b);
    });
  } catch(e) { $("channels").textContent = "kanal hatası: " + e.message; }
}
async function loadMsgs(cid) {
  $("msgs").innerHTML = "";
  try {
    const ms = await api(`channels/${cid}/messages?limit=30`);
    ms.reverse().forEach(m => addMsg(m.author?.username||"?", m.content||"", m.timestamp, m.attachments||[]));
  } catch(e) { addMsg("sistem", "mesaj hatası: " + e.message, null); }
}
$("send").onclick = async () => {
  const t = $("inp").value.trim(); if (!t || !curChan) return;
  $("inp").value = "";
  try { await api(`channels/${curChan.id}/messages`, "POST", { content: t }); }
  catch(e) { addMsg("sistem", "gönderilemedi: " + e.message, null); }
};
$("inp").addEventListener("keydown", e => { if (e.key === "Enter") $("send").click(); });

function connectGw() {
  if (gw) try { gw.close(); } catch {}
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  gw = new WebSocket(proto + "//" + location.host + "/relay/gateway");
  gw.onopen = () => $("status").textContent += " · gateway bağlandı";
  gw.onmessage = ev => {
    let p; try { p = JSON.parse(ev.data); } catch { return; }
    if (p.s) seq = p.s;
    if (p.op === 10) { // Hello
      const hb = p.d.heartbeat_interval;
      clearInterval(hbTimer); hbTimer = setInterval(() => gw.send(JSON.stringify({ op:1, d:seq })), hb);
      gw.send(JSON.stringify({ op:2, d:{ token, intents:33280, properties:{ os:"linux", browser:"relay", device:"relay" } } }));
    } else if (p.op === 0 && p.t === "MESSAGE_CREATE") {
      const m = p.d;
      if (curChan && m.channel_id === curChan.id) addMsg(m.author?.username||"?", m.content||"", m.timestamp, m.attachments||[]);
    }
  };
  gw.onclose = () => { $("status").textContent += " · gateway koptu (5sn sonra tekrar)"; setTimeout(connectGw, 5000); };
}
</script>
</body>
</html>
